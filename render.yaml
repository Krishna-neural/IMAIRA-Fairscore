services:
  - type: web
    name: imaira-fairscore
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FAIRSCORE_HOST
        value: 0.0.0.0
      - key: GEMINI_API_KEY
        sync: false
